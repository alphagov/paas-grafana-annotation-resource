name: Post Merge

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  tag-release:
    needs:
      - tests
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@591ff32de6cd3c9a0f4af2506f8938e7bd5decaa
